:root{
  --bg:#eef3f8;
  --surface:#ffffff;
  --surface-2:#f4f8fc;
  --ink:#10222f;
  --muted:#66798a;
  --line:#d9e4ee;
  --primary:#1667d9;
  --primary-dark:#0d4eae;
  --green:#0f9d63;
  --green-dark:#0b7d4f;
  --red:#d9373e;
  --amber:#f2a61a;
  --soft-blue:#e7f0fd;
  --soft-green:#e7f7ef;
  --soft-amber:#fff5d9;
  --soft-red:#fdecec;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1720;
    --surface:#152433;
    --surface-2:#1a2f41;
    --ink:#edf4fa;
    --muted:#a6b9c9;
    --line:#2a4156;
    --primary:#4b96f2;
    --primary-dark:#6eabf5;
    --soft-blue:#1d3550;
    --soft-green:#173f30;
    --soft-amber:#46391d;
    --soft-red:#482429;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  cursor:not-allowed;
  opacity:.55
}

a{
  color:inherit
}

.shell{
  min-height:100vh;
  background:var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px)
}

@media (prefers-color-scheme: dark){
  .topbar{
    background:rgba(21,36,51,.96)
  }
}

.topbar-inner{
  max-width:1240px;
  margin:0 auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0
}

.brand-mark{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--primary);
  color:#fff;
  display:grid;
  place-items:center;
  font-family:'Sora',sans-serif;
  font-weight:800;
  font-size:20px;
  flex:0 0 auto
}

.brand b{
  font-family:'Sora',sans-serif;
  font-size:19px;
  line-height:1;
  letter-spacing:-.02em
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:4px
}

.topnav{
  display:flex;
  gap:6px;
  align-items:center
}

.topnav button{
  border:0;
  background:transparent;
  color:var(--muted);
  font-weight:700;
  font-size:13px;
  padding:9px 12px;
  border-radius:999px
}

.topnav button.active,.topnav button:hover{
  background:var(--soft-blue);
  color:var(--primary)
}

.live{
  font-size:12px;
  font-weight:800;
  color:var(--green);
  display:flex;
  align-items:center;
  gap:6px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px var(--soft-green)
}

.page{
  max-width:1240px;
  margin:0 auto;
  padding:22px 20px 40px
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end;
  margin:4px 0 20px
}

.hero h1{
  font-family:'Sora',sans-serif;
  font-size:clamp(28px,4vw,44px);
  line-height:1.02;
  letter-spacing:-.04em;
  margin:0;
  max-width:760px
}

.hero h1 em{
  font-style:normal;
  color:var(--primary)
}

.hero p{
  color:var(--muted);
  line-height:1.6;
  margin:12px 0 0;
  max-width:760px;
  font-size:15px
}

.hero-badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.pill{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:800
}

.pill.blue{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.pill.green{
  background:var(--soft-green);
  color:var(--green);
  border-color:transparent
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:18px;
  align-items:start
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(16,34,47,.06);
  overflow:hidden
}

.card-pad{
  padding:18px
}

.card-head{
  padding:17px 18px 0;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start
}

.card-head h2{
  font-family:'Sora',sans-serif;
  font-size:19px;
  line-height:1.2;
  margin:0;
  letter-spacing:-.02em
}

.card-head p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.eyebrow{
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--primary);
  margin-bottom:7px
}

.mini-badge{
  font-size:11px;
  font-weight:800;
  padding:6px 9px;
  border-radius:999px;
  background:var(--soft-blue);
  color:var(--primary);
  white-space:nowrap
}

.people-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.person{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  background:var(--surface-2)
}

.person.requester{
  border-top:3px solid var(--primary)
}

.person.receiver{
  border-top:3px solid var(--green)
}

.person-label{
  font-size:11px;
  font-weight:800;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--muted);
  display:flex;
  justify-content:space-between
}

.person h3{
  font-family:'Sora',sans-serif;
  font-size:16px;
  margin:8px 0 12px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
  color:var(--ink)
}

.field label span{
  color:var(--muted);
  font-weight:600
}

.input,.select,.textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:12px 12px;
  outline:none
}

.input:focus,.select:focus,.textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--soft-blue)
}

.textarea{
  min-height:118px;
  resize:vertical;
  line-height:1.55
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.three-col{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px
}

.automation{
  background:#10222f;
  color:#eaf4ff;
  border-radius:14px;
  padding:15px
}

.automation-top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:center
}

.automation-top h3{
  margin:0;
  font-size:15px
}

.automation-top p{
  margin:5px 0 0;
  color:#a9c1d5;
  font-size:12px;
  line-height:1.5
}

.switch{
  position:relative;
  width:62px;
  height:32px;
  border-radius:999px;
  background:#40566a;
  border:0;
  flex:0 0 auto;
  padding:3px
}

.switch.on{
  background:var(--green)
}

.switch i{
  position:absolute;
  top:3px;
  left:3px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#fff;
  transition:transform .2s;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:13px
}

.switch.on i{
  transform:translateX(30px)
}

.status-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px
}

.status-cell{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px
}

.status-cell small{
  display:block;
  color:#a9c1d5;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-weight:800
}

.status-cell b{
  font-size:13px
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 16px;
  font-weight:800;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .15s,filter .15s
}

.btn:active{
  transform:translateY(1px)
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  width:100%
}

.btn-primary:hover{
  background:var(--primary-dark)
}

.btn-dark{
  background:var(--ink);
  color:var(--surface);
  width:100%
}

.btn-green{
  background:var(--green);
  color:#fff
}

.btn-green:hover{
  background:var(--green-dark)
}

.btn-red{
  background:var(--red);
  color:#fff
}

.btn-outline{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink)
}

.btn-light{
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line)
}

.btn-row{
  display:flex;
  gap:10px
}

.btn-row>*{
  flex:1
}

.route-visual{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px
}

.route-node{
  flex:1;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
  text-align:center;
  background:var(--surface-2)
}

.route-node b{
  display:block;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.route-node small{
  color:var(--muted);
  font-size:11px
}

.route-node.center{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.route-node.center small{
  color:#d7e7ff
}

.route-arrow{
  font-size:20px;
  color:var(--muted);
  flex:0 0 auto
}

.route-line{
  margin-top:12px;
  background:var(--soft-green);
  border-radius:10px;
  padding:11px 12px;
  font-size:13px;
  font-weight:700;
  color:#126643
}

.output{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:14px;
  background:var(--surface-2);
  border-radius:12px;
  padding:16px;
  border:1px solid var(--line);
  min-height:180px
}

.output-empty{
  color:var(--muted);
  display:grid;
  place-items:center;
  text-align:center;
  min-height:180px;
  padding:20px
}

.meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px
}

.meta{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  background:var(--surface)
}

.meta small{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase
}

.meta b{
  font-size:13px
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800
}

.badge.pending{
  background:var(--soft-amber);
  color:#7a5a00
}

.badge.approved{
  background:var(--soft-green);
  color:#0b6b43
}

.badge.rejected{
  background:var(--soft-red);
  color:#9c2328
}

.approval{
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  background:var(--surface-2)
}

.approval p{
  margin:8px 0 14px;
  color:var(--muted);
  line-height:1.6;
  font-size:14px
}

.approval p b{
  color:var(--ink)
}

.email-preview{
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  background:var(--surface-2)
}

.email-preview p{
  margin:0 0 7px;
  font-size:13px
}

.email-preview p:last-child{
  margin:0
}

.log{
  list-style:none;
  margin:0;
  padding:0
}

.log li{
  display:flex;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  align-items:flex-start
}

.log li:last-child{
  border-bottom:0
}

.log-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--soft-blue);
  flex:0 0 auto;
  font-size:15px
}

.log b{
  font-size:13px;
  display:block
}

.log span{
  font-size:12px;
  color:var(--muted)
}

.log time{
  margin-left:auto;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap
}

.bottom-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px;
  margin-top:18px
}

.signoff-row{
  display:flex;
  gap:10px;
  align-items:flex-end
}

.check{
  display:flex;
  gap:9px;
  align-items:flex-start;
  background:var(--soft-blue);
  border-radius:10px;
  padding:11px 12px;
  font-size:13px;
  line-height:1.45;
  margin-top:12px
}

.check input{
  width:18px;
  height:18px;
  accent-color:var(--primary);
  margin-top:1px;
  flex:0 0 auto
}

.toast-wrap{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:min(360px,calc(100vw - 36px))
}

.toast{
  background:var(--ink);
  color:var(--surface);
  border-radius:12px;
  padding:13px 14px;
  box-shadow:0 14px 34px rgba(0,0,0,.22);
  font-size:13px;
  font-weight:700;
  line-height:1.45;
  display:flex;
  gap:9px;
  align-items:flex-start
}

.toast button{
  margin-left:auto;
  background:transparent;
  border:0;
  color:inherit;
  font-size:16px;
  line-height:1
}

.footer{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

@media (max-width: 900px){
  .layout{
    grid-template-columns:1fr
  }

  .bottom-grid{
    grid-template-columns:1fr
  }

  .hero{
    align-items:flex-start;
    flex-direction:column
  }

  .hero-badges{
    justify-content:flex-start
  }
}

@media (max-width: 768px){
  .page{
    padding:16px 12px 28px
  }

  .topbar-inner{
    padding:10px 12px;
    flex-wrap:wrap
  }

  .brand b{
    font-size:17px
  }

  .brand span{
    font-size:10px
  }

  .topnav{
    width:100%;
    order:3;
    overflow-x:auto;
    padding-bottom:2px
  }

  .topnav button{
    white-space:nowrap
  }

  .live{
    font-size:11px
  }

  .hero{
    margin-top:2px
  }

  .hero p{
    font-size:14px
  }

  .card-pad,.card-head{
    padding-left:14px;
    padding-right:14px
  }

  .people-grid,.two-col,.three-col,.meta-grid{
    grid-template-columns:1fr
  }

  .status-row{
    grid-template-columns:1fr 1fr
  }

  .status-row .status-cell:last-child{
    grid-column:1/-1
  }

  .route-visual{
    flex-direction:column
  }

  .route-node{
    width:100%
  }

  .route-arrow{
    transform:rotate(90deg)
  }

  .btn-row{
    flex-direction:column
  }

  .btn,.btn-row .btn{
    width:100%
  }

  .signoff-row{
    flex-direction:column;
    align-items:stretch
  }

  .log li{
    flex-wrap:wrap
  }

  .log time{
    margin-left:36px
  }

  .toast-wrap{
    left:12px;
    right:12px;
    bottom:12px;
    max-width:none
  }

  .automation-top{
    align-items:flex-start
  }
}

@media (max-width: 420px){
  .topbar-inner{
    gap:8px
  }

  .brand-mark{
    width:36px;
    height:36px;
    font-size:18px
  }

  .card{
    border-radius:15px
  }

  .btn{
    padding:14px 12px
  }
}
